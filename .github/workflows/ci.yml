name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.17.3
      - run: ruff check . && ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt $(ls */requirements.txt | grep -v airflow | sed 's/^/-r /')
      - run: python -m pytest -m "not spark and not integration and not airflow" -q

  spark-tests-coverage:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt $(ls */requirements.txt | grep -v airflow | sed 's/^/-r /')
      # Unitários + Spark juntos: a meta de cobertura vale para ingestion, api, databricks/src e airflow/include
      - run: python -m pytest -m "not integration and not airflow" --cov --cov-report=term --cov-fail-under=80

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Mesmos hooks do commit local (inclui gitleaks): pega o que entrou com --no-verify
      - uses: pre-commit/action@v3.0.1

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: |
          cp .env.example .env
          if [ -f docker-compose.yml ]; then docker compose config -q; else echo "compose ainda não criado"; fi
      - name: Validar JSON/YAML
        run: |
          python -c "import json,glob;[json.load(open(f)) for f in glob.glob('**/*.json',recursive=True)]"
